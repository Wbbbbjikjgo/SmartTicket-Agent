# Agent 系统配置
agent:
  llm:
    model: ${LLM_MODEL:-deepseek-chat}
    base_url: ${LLM_BASE_URL:-https://api.deepseek.com}
    api_key: ${DEEPSEEK_API_KEY}
    temperature: 0.1
    max_tokens: 4096

  embedding:
    model: ${EMBEDDING_MODEL:-text-embedding-v3}
    api_key: ${DASHSCOPE_API_KEY}
    dims: 1024

  rerank:
    model: ${RERANK_MODEL:-gte-rerank-v2}
    api_key: ${DASHSCOPE_API_KEY}
    top_n: 10

  intent:
    # 意图分类体系
    intents:
      - create_ticket    # 创建工单
      - query_ticket     # 查询工单
      - search_knowledge # 知识检索
      - assign           # 派单/转人工
      - chitchat         # 闲聊

  slot:
    # 必填槽位
    required:
      - problem_type
      - description
    # 可选槽位
    optional:
      - product
      - urgency
      - device
    # 置信度阈值（低于此值需追问）
    confidence_threshold: 0.7

  # ---------- 智能路由配置 ----------
  # 作用：根据用户描述的问题，自动判断该分配给哪个处理团队
  routing:
    # -------- 规则过滤置信度阈值 --------
    # 含义：当系统通过规则匹配（如关键词/正则表达式）判断问题类型时，
    #       匹配度必须 ≥ 0.8（即 80% 置信度）才会采纳该规则结果
    # 作用：
    #   - 避免模糊匹配导致分错工单（比如"登录不了"匹配"登录问题"置信度 0.95 ✓）
    #   - 低于阈值时，系统会降级使用其他策略（如 AI 语义分类或人工分配）
    # 调优建议：太高（0.95）→ 很多工单无法自动分配；太低（0.5）→ 容易分错
    rule_confidence_threshold: 0.8

    # -------- 技能组映射表 --------
    # 含义：将"问题类型"映射到"处理团队/技能组"
    # 作用：当系统识别出问题类型后，根据此映射自动指派给对应团队
    # 扩展性：支持增删改，新增问题类型时只需在此添加一行
    skill_groups:
      # 用户无法登录/账号密码问题 → IT 支持组
      登录问题: IT支持组
      
      # 网络连接/网速/VPN 问题 → IT 支持组
      网络问题: IT支持组
      
      # 硬件设备损坏/故障 → 维修工程师组
      设备故障: 维修工程师
      
      # 发票/报销/账单/对账问题 → 财务组
      财务问题: 财务组
      
      # 系统崩溃/报错/性能问题 → IT 支持组（与登录/网络同组）
      系统故障: IT支持组

      # ⚠️ 注意：未在列表中映射的问题类型，会进入"待分配"队列由人工处理


  # ---------- 知识库管理配置 ----------
  # 作用：管理智能工单系统中的知识文章（解决方案/FAQ/操作手册）
  knowledge:
    # -------- 知识去重相似度阈值 --------
    # 含义：当新增一篇知识文章时，系统会与已有文章计算文本相似度
    #       如果相似度 ≥ 0.92（92%），则认为两篇文章可能重复，触发去重提醒
    # 作用：
    #   - 防止知识库中出现大量重复/高度相似的内容
    #   - 降低维护成本，提升知识检索效率
    # 场景示例：两篇文章都讲"重置密码"，相似度 0.95 → 提示合并
    dedup_threshold: 0.92

    # -------- 知识质量最低分 --------
    # 含义：知识文章的质量评分（由 AI 自动评估或人工打分），满分通常为 1.0
    #       低于 0.6 分的文章将不会被用于"智能推荐/自动回复"
    # 作用：
    #   - 过滤低质量内容（如内容不完整、过时、表述模糊等）
    #   - 确保客服/用户看到的推荐答案质量有保证
    # 评分维度举例：内容完整性、可读性、时效性、历史解决率等
    min_quality_score: 0.6
