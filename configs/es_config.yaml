# ============================================================
# Elasticsearch 配置模块
# ============================================================
es:
  # ---------- 连接地址 ----------
  # ${ES_HOST:-http://localhost:9200} 含义：
  #   1. 优先读取系统环境变量 ES_HOST（用于生产环境动态配置）
  #   2. 若环境变量不存在，则使用默认值 http://localhost:9200（用于本地开发）
  host: ${ES_HOST:-http://localhost:9200}

  # ---------- 索引名称定义 ----------
  # 程序代码中通过 es.indices.tickets 等方式引用，避免硬编码字符串
  # 每个也支持环境变量覆盖，方便不同环境（开发/测试/生产）使用不同索引名
  indices:
    # 工单索引：存储客户工单/诉求数据
    tickets: ${ES_INDEX_TICKETS:-tickets}
    
    # 知识库索引：存储文档/手册/内部知识文章
    knowledge_base: ${ES_INDEX_KNOWLEDGE:-knowledge_base}
    
    # FAQ 索引：存储常见问题与标准答案，通常用于自动问答或智能客服
    faq: ${ES_INDEX_FAQ:-faq}

  # ---------- 向量检索配置（用于语义搜索 / AI 问答） ----------
  vector:
    # 向量维度：必须与 Embedding 模型输出的维度严格一致
    # text-embedding-v3 模型输出 1024 维向量，若模型更换需同步修改
    dims: 1024
    
    # 相似度算法：cosine（余弦相似度）
    # 用于计算用户问题向量与文档库向量的语义相似度，值域 [-1, 1]，越接近 1 越相关
    # 其他可选：dot_product（点积）、l1_norm、l2_norm 等
    similarity: cosine

  # ---------- 中文分词器配置（需安装 IK 分词插件） ----------
  analyzer:
    # 索引阶段（写入数据时）的分词策略
    # ik_max_word：最细粒度切分，尽可能多地拆分词语，提高"召回率"
    # 示例："中华人民共和国" → 中华/中华人民/中华人民共和国/华人/人民/共和国...
    index: ik_max_word
    
    # 搜索阶段（用户查询时）的分词策略
    # ik_smart：最粗粒度切分，智能合并，提高"精准率"
    # 示例："中华人民共和国" → 中华人民共和国（整体作为一个词）
    # 策略：索引时多分词（保证能被搜到），搜索时少分词（保证搜得准）
    search: ik_smart