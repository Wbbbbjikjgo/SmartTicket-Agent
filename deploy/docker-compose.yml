services:
  # ========== Elasticsearch（官方镜像 + IK 分词插件） ==========
  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.es
    container_name: smart-ticket-es
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      retries: 12
      timeout: 5s
    networks:
      - ticket-net

  # ========== Kafka（KRaft 模式，无需 Zookeeper） ==========
  # 双监听：INTERNAL(9092) 供容器内访问，EXTERNAL(9094) 供宿主机本地开发访问
  kafka:
    image: apache/kafka:3.7.0
    container_name: smart-ticket-kafka
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "9094:9094"
    volumes:
      - kafka_data:/opt/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      retries: 10
      timeout: 10s
    networks:
      - ticket-net

  # ========== 工单后台消费者 worker ==========
  # 消费部门 Topic 确认工单进入后台；消费 ticket-resolved 沉淀向量与知识库
  ticket-worker:
    build:
      context: ..
      dockerfile: agent-service/Dockerfile
    container_name: smart-ticket-worker
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - ES_HOST=http://elasticsearch:9200
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_WORKER_GROUP=ticket-resolution-worker
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - LLM_MODEL=deepseek-chat
      - LLM_BASE_URL=https://api.deepseek.com
      - EMBEDDING_MODEL=text-embedding-v3
      - RERANK_MODEL=gte-rerank-v2
      - VECTOR_DIMS=1024
    volumes:
      - ..:/app
    networks:
      - ticket-net

  # ========== Streamlit 前端 ==========
  streamlit-app:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: smart-ticket-web
    depends_on:
      - ticket-worker
    environment:
      - ES_HOST=http://elasticsearch:9200
      - KAFKA_BOOTSTRAP=kafka:9092
      # 由独立 ticket-worker 消费，避免重复消费
      - ENABLE_KAFKA_WORKER=0
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - LLM_MODEL=deepseek-chat
      - LLM_BASE_URL=https://api.deepseek.com
      - EMBEDDING_MODEL=text-embedding-v3
      - VECTOR_DIMS=1024
    ports:
      - "8502:8501"
    volumes:
      - ..:/app
    networks:
      - ticket-net

volumes:
  es_data:
    driver: local
  kafka_data:
    driver: local

networks:
  ticket-net:
    driver: bridge
